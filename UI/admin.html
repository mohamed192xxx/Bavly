<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="admin">
  <div id="bg-layer"></div>
  <div class="shell glass-panel admin-shell">
    <button class="btn back" onclick="window.openHome()">← Home</button>

    <section id="adminLogin" class="login-card glass-panel">
      <h2>Admin Authentication</h2>
      <input id="adminPassword" type="password" placeholder="Admin password" />
      <button class="btn" onclick="window.adminLogin()">Login</button>
    </section>

    <section id="adminDashboard" class="hidden">
      <h2>Game Management</h2>
      <form id="gameForm" class="form-grid">
        <input id="gameId" type="hidden" />
        <input id="gameName" placeholder="Game name" required />
        <input id="gameDescription" placeholder="Description" />
        <div class="input-row">
          <input id="exePath" placeholder="EXE path" required />
          <button type="button" class="btn" onclick="window.pickExe()">Browse</button>
        </div>
        <div class="input-row">
          <input id="imagePath" placeholder="Image path" />
          <button type="button" class="btn" onclick="window.pickImage()">Browse</button>
        </div>
        <input id="workingDirectory" placeholder="Working directory" />
        <select id="gameCategory"></select>
        <button type="submit" class="btn">Save Game</button>
      </form>

      <h3>Categories</h3>
      <div class="input-row">
        <input id="newCategoryName" placeholder="New category" />
        <button class="btn" onclick="window.addCategory()">Add</button>
      </div>

      <div id="adminGames" class="admin-list"></div>
      <div id="adminCategories" class="admin-list"></div>
    </section>
  </div>

  <div id="toastHost" class="toast-host"></div>
  <script src="app.js"></script>
</body>
</html>
